name: prepare
description: A tool to prepare and process Dart/Flutter source code for cloning and code generation.
version: 0.0.1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  yaml: ^3.1.2
  path: ^1.8.0
  args: ^2.5.0
  dart_style: ^2.3.6
  json2yaml: ^3.0.1
  analyzer: <6.5.0
  collection: ^1.18.0
  code_builder: ^4.10.0
  fs_shim: ^2.3.4
  glob: ^2.1.3

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
