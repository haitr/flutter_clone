name: clone
repository: https://github.com/haitr/flutter_clone

packages:
  - clone/**
  - packages/**

command:
  version:
    # Conventional commits specification: https://conventionalcommits.org
    conventionalCommits: true
    # Include workspace package when versioning
    includeScopes: true

scripts:
  analyze:
    description: Run analyzer in all packages.
    run: melos exec -- dart analyze .

  analyze_project:
    description: Run analyzer in project_analyze.
    steps:
      - dart project_analyze/bin/project_analyze.dart --input=generated/flutter --output=generated/ --filter=**/interactive_viewer.dart

  clone_test:
    description: Clone Flutter.
    steps:
      - dart run flutter_clone/bin/flutter_clone.dart --output=flutter_example/generated --widget=*Button

  clone:
    description: Clone Flutter.
    steps:
      - dart run flutter_clone/bin/flutter_clone.dart --output=flutter_example/generated
